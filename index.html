<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>H2-X 砸车关</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7.5' fill='%23e6ecf4'/%3E%3Crect x='5' y='4' width='9.5' height='8' rx='3' fill='%231a1c23'/%3E%3Crect x='7' y='6' width='2' height='3' fill='%235ef2ff'/%3E%3Crect x='11' y='6' width='1.5' height='3' fill='%235ef2ff'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: arcade cabinet — one centred pixel screen; touch pad below it (portrait) or either side (landscape) */
:root {
  --bg: #0b0c11;
  --panel: #151821;
  --line: #2a2f3d;
  --fg: #e8ecf4;
  --muted: #8d95aa;
  --accent: #5ef2ff;
  --kick: #ff9a3a;
  --ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  color: var(--fg);
  font: 14px/1.6 var(--ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#screen {
  display: block;
  width: 384px;
  max-width: 100%;
  aspect-ratio: 384 / 224;
  image-rendering: pixelated;
  background: #04050a;
  outline: 1px solid var(--line);
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  justify-content: center;
  max-width: 76ch;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
kbd {
  font: 12px var(--mono);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 5px;
  margin: 0 1px;
}
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tools button {
  font: 12px var(--ui);
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 4px 10px;
  cursor: pointer;
}
.tools button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#pad {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  max-width: 440px;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#stick {
  position: relative;
  flex: none;
  width: 128px;
  height: 128px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--line);
  touch-action: none;
}
#knob {
  position: absolute;
  left: 39px;
  top: 39px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--line);
  border: 1px solid var(--muted);
  pointer-events: none;
}
.btns { display: grid; grid-template-columns: repeat(3, 56px); gap: 8px; }
.btns button {
  height: 44px;
  padding: 0;
  font: 13px var(--ui);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  touch-action: none;
}
.btns button[data-b$="P"] { border-color: var(--accent); }
.btns button[data-b$="K"] { border-color: var(--kick); }
.btns button.sp { height: 34px; font-size: 12px; color: var(--muted); }
.btns button.on { background: var(--line); }
body.touch .keys { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  body.touch main { flex-direction: row; justify-content: center; }
  body.touch #pad { display: contents; }
  body.touch #stick { order: -1; }
  body.touch .btns { order: 1; }
  body.touch .tools { display: none; }
}
.sheet { max-width: 100%; overflow-x: auto; }
.sheet canvas { display: block; image-rendering: pixelated; }
</style>

<main>
  <canvas id="screen" width="384" height="224" aria-label="H2-X 砸车奖励关"></canvas>
  <p id="assetStatus" role="status">正在载入汽车素材…</p>
  <div id="pad" hidden>
    <div id="stick" aria-label="方向"><span id="knob"></span></div>
    <div class="btns">
      <button type="button" data-b="LP">轻拳</button><button type="button" data-b="MP">中拳</button><button type="button" data-b="HP">重拳</button>
      <button type="button" data-b="LK">轻脚</button><button type="button" data-b="MK">中脚</button><button type="button" data-b="HK">重脚</button>
      <button type="button" class="sp" data-sp="BENG">崩拳</button><button type="button" class="sp" data-sp="XFT">旋风腿</button><button type="button" class="sp" data-sp="TFF">铁花空翻</button>
    </div>
  </div>
  <p class="keys">
    <span><kbd>Enter</kbd> 开始</span>
    <span><kbd>A</kbd><kbd>D</kbd> 移动 <kbd>W</kbd> 跳 <kbd>S</kbd> 蹲（方向键也行）</span>
    <span><kbd>U</kbd><kbd>I</kbd><kbd>O</kbd> 轻·中·重拳</span>
    <span><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> 轻·中·重脚</span>
    <span>→ + 拳 下压肘击</span>
    <span>→ + 脚 膝撞</span>
    <span>空中 ↓ + 拳 坠肘</span>
    <span>空中 ↓ + 脚 踩踏</span>
    <span>车顶 拳下砸 · 脚踩踏</span>
    <span>↓↘→ + 拳 崩拳</span>
    <span>↓↙← + 脚 旋风腿</span>
    <span>→↓↘ + 脚 铁花空翻</span>
  </p>
  <div class="tools">
    <button type="button" id="bSound" aria-pressed="true">声音</button>
    <button type="button" id="bBox" aria-pressed="false">判定框</button>
    <button type="button" id="bSheet" aria-pressed="false">精灵表</button>
  </div>
  <div class="sheet" id="sheetBox" hidden><canvas id="sheet"></canvas></div>
</main>

<script>
'use strict';
// ════════ palettes: the robot keeps a CPS1-style 15-colour budget; car, glass and spectators get their own ramps ════════
const PAL = ['', '#ffffff', '#e6ecf4', '#bcc7d6', '#8592aa', '#545d77', '#232739',
  '#6c7282', '#434858', '#2b2f3a', '#1a1c23', '#08090c', '#eaffff', '#5ef2ff', '#1597d4', '#ff9a3a',
  '#f2fffb', '#79d8c6', '#36a796', '#1d6f69', '#103f45', '#071a1f',       // 16-21 car paint, swapped per round
  '#ffffff', '#9fd3ea', '#5486ad', '#2a4566', '#0b1622',                  // 22-26 glass
  '#f4f6fa', '#b4b9c4', '#767c8a', '#454a57', '#12141a',                  // 27-31 chrome
  '#5a5c66', '#33353d', '#1d1e23', '#0b0b0e',                             // 32-35 rubber
  '#fff7d6', '#f3c75a', '#ff7b6b', '#b3242f',                             // 36-39 head / tail lamps
  '#202128', '#111116',                                                   // 40-41 cabin interior
  '#c9ced8', '#8e95a3', '#585e6d', '#14161c', '#eef1f6'];                 // 42-46 quadruped spectators
const hexRGB = h => h && [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const RGB = PAL.map(hexRGB);
const MAT = {                                   // ramp: [specular, light, mid, shadow]
  white:  { ramp: [1, 2, 3, 4], line: 6, gloss: .975 },
  black:  { ramp: [7, 8, 9, 10], line: 11, gloss: .985 },
  metal:  { ramp: [2, 3, 4, 5], line: 11, gloss: .99 },
  screen: { ramp: [4, 9, 10, 11], line: 11, gloss: .955 },
  glow:   { ramp: [12, 13, 13, 13], line: 14, gloss: 2 },
  paint:  { ramp: [16, 17, 18, 19], line: 21, gloss: .97 },
  dent:   { ramp: [17, 18, 19, 20], line: 21, gloss: 2 },
  seam:   { ramp: [20, 20, 20, 20], line: 21, gloss: 2 },
  glass:  { ramp: [22, 23, 24, 25], line: 26, gloss: .96 },
  streak: { ramp: [22, 23, 23, 23], line: 26, gloss: 2 },
  crack:  { ramp: [22, 22, 22, 22], line: 26, gloss: 2 },
  chrome: { ramp: [27, 28, 29, 30], line: 31, gloss: .96 },
  rubber: { ramp: [32, 33, 34, 34], line: 35, gloss: .99 },
  head:   { ramp: [36, 36, 37, 37], line: 31, gloss: 2 },
  tail:   { ramp: [38, 38, 39, 39], line: 31, gloss: 2 },
  inside: { ramp: [40, 40, 41, 41], line: 35, gloss: 2 },
  dog:    { ramp: [46, 42, 43, 44], line: 45, gloss: .975 },
};
const unit = v => { const l = Math.hypot(...v); return v.map(c => c / l); };
const LIGHT = unit([-.6, -.55, .58]), HALF = unit([LIGHT[0], LIGHT[1], LIGHT[2] + 1]);
const tone = (m, I, sp) => sp > m.gloss ? m.ramp[0] : m.ramp[I > .64 ? 1 : I > .46 ? 2 : 3];

// ════════ sprite rasteriser: SDF parts → indexed pixels, hard edges, auto outline ════════
let BW = 176, BH = 176, OX = 88, OY = 156;      // current bake buffer; shape constructors read these
const useBuf = (w, h, ox, oy) => { BW = w; BH = h; OX = ox; OY = oy; };
const bp = p => [OX + p[0], OY - p[1]];          // authoring coords (y up) → buffer (y down)
const box = (x0, y0, x1, y1, m) => [x0 - m, y0 - m, x1 + m, y1 + m];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const off = (p, d, k) => [p[0] + d[0] * k, p[1] + d[1] * k];

function circle(c, r) {
  const [cx, cy] = bp(c);
  return { f: (x, y) => Math.hypot(x - cx, y - cy) - r, bb: box(cx, cy, cx, cy, r + 1) };
}
function capsule(a, b, r1, r2) {                 // tapered capsule (iq's uneven capsule)
  const [ax, ay] = bp(a), [bx, by] = bp(b);
  const len = Math.hypot(bx - ax, by - ay) || 1e-3;
  const ux = (bx - ax) / len, uy = (by - ay) / len;
  const h = Math.max(len, Math.abs(r1 - r2) + .01);
  const q = (r1 - r2) / h, k0 = Math.sqrt(1 - q * q);
  return {
    f(x, y) {
      const px = x - ax, py = y - ay;
      const ly = px * ux + py * uy, lx = Math.abs(px * uy - py * ux);
      const k = -q * lx + k0 * ly;
      if (k < 0) return Math.hypot(lx, ly) - r1;
      if (k > k0 * h) return Math.hypot(lx, ly - h) - r2;
      return lx * k0 + ly * q - r1;
    },
    bb: box(Math.min(ax, bx), Math.min(ay, by), Math.max(ax, bx), Math.max(ay, by), Math.max(r1, r2) + 1),
  };
}
function ellipse(c, rx, ry, ang) {               // ponytail: first-order distance estimate, good enough for shading
  const [cx, cy] = bp(c), ca = Math.cos(ang), sa = Math.sin(ang);
  return {
    f(x, y) {
      const dx = x - cx, dy = y - cy, lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      const k = Math.hypot(lx / rx, ly / ry);
      if (k < 1e-6) return -Math.min(rx, ry);
      return (k - 1) / (Math.hypot(lx / (rx * rx), ly / (ry * ry)) / k);
    },
    bb: box(cx, cy, cx, cy, Math.max(rx, ry) + 1),
  };
}
function poly(pts, rad = 0) {                    // rounded polygon (iq's polygon SDF)
  const V = pts.map(bp), n = V.length, xs = V.map(v => v[0]), ys = V.map(v => v[1]);
  return {
    f(x, y) {
      let d = Infinity, s = 1;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const [xi, yi] = V[i], [xj, yj] = V[j];
        const ex = xj - xi, ey = yj - yi, wx = x - xi, wy = y - yi;
        const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
        const qx = wx - ex * t, qy = wy - ey * t;
        d = Math.min(d, qx * qx + qy * qy);
        const c1 = y >= yi, c2 = y < yj, c3 = ex * wy > ey * wx;
        if (c1 === c2 && c2 === c3) s = -s;
      }
      return s * Math.sqrt(d) - rad;
    },
    bb: box(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), rad + 1),
  };
}

// one part → pixels: bevelled normal from the SDF, lit from the upper left, posterised to the ramp
function raster(B, p) {
  const x0 = Math.max(0, Math.floor(p.bb[0])), y0 = Math.max(0, Math.floor(p.bb[1]));
  const x1 = Math.min(BW - 1, Math.ceil(p.bb[2])), y1 = Math.min(BH - 1, Math.ceil(p.bb[3]));
  const form = p.form || p.f, dk = p.dk || 0, inset = p.inset ?? .5, flip = p.concave ? -1 : 1;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const px = x + .5, py = y + .5;
    if (p.f(px, py) > 0 || (p.clip && p.clip(px, py) > -inset)) continue;
    const d = form(px, py);
    const gx = form(px + .4, py) - form(px - .4, py), gy = form(px, py + .4) - form(px, py - .4);
    const gl = (Math.hypot(gx, gy) || 1) * flip;
    const s = Math.max(0, Math.min(1, 1 + d / p.R)), nz = Math.sqrt(1 - s * s);
    const nx = gx / gl * s, ny = gy / gl * s;
    const I = .22 + .78 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) + dk;
    const sp = dk ? 0 : nx * HALF[0] + ny * HALF[1] + nz * HALF[2];
    const i = y * BW + x;
    B.c[i] = tone(p.mat, I, sp); B.l[i] = p.layer; B.o[i] = p.mat.line; B.v[i] = p.visor ? 1 : 0;
  }
}
// lone pixels that match none of their 4 neighbours take the majority colour (posterising noise)
function despeckle(B) {
  const c = B.c, out = c.slice();
  for (let y = 1; y < BH - 1; y++) for (let x = 1; x < BW - 1; x++) {
    const i = y * BW + x, v = c[i];
    if (!v) continue;
    const n = [c[i - 1], c[i + 1], c[i - BW], c[i + BW]];
    if (n.includes(v) || n.includes(0)) continue;
    const cnt = {};
    for (const q of n) cnt[q] = (cnt[q] || 0) + 1;
    const [best, k] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    if (k >= 2) out[i] = +best;
  }
  B.c = out;
}
// 1px outline outside the silhouette + seam lines where a nearer layer overlaps a farther one
function outline(B) {
  despeckle(B);
  const { c, l, o, v } = B, out = c.slice();
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
    const i = y * BW + x;
    const nb = [x > 0 ? i - 1 : -1, x < BW - 1 ? i + 1 : -1, y > 0 ? i - BW : -1, y < BH - 1 ? i + BW : -1];
    if (!c[i]) {
      let best = -1;
      for (const j of nb) if (j >= 0 && c[j] && l[j] > best) { best = l[j]; out[i] = o[j]; }
    } else {
      for (const j of nb) if (j >= 0 && c[j] && l[j] > l[i]) { out[i] = o[i]; v[i] = 0; break; }
    }
  }
  B.c = out;
}
function renderParts(parts, rgb = RGB) {         // → cropped canvas + offsets from the buffer origin
  const N = BW * BH, B = { c: new Uint8Array(N), l: new Int8Array(N), o: new Uint8Array(N), v: new Uint8Array(N) };
  for (const p of parts) raster(B, p);
  outline(B);
  let x0 = BW, y0 = BH, x1 = 0, y1 = 0;
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) if (B.c[y * BW + x]) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  if (x0 > x1) x0 = y0 = x1 = y1 = 0;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'), img = cx.createImageData(w, h), mask = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y + y0) * BW + x + x0, k = y * w + x, col = rgb[B.c[i]];
    if (!col) continue;
    img.data.set([col[0], col[1], col[2], 255], k * 4);
    mask[k] = B.v[i];
  }
  cx.putImageData(img, 0, 0);
  return { cv, x0, y0, w, h, dx: x0 - OX, dy: y0 - OY, ox: OX, oy: OY, mask };
}

// ════════ 5×7 bitmap font (canvas text would anti-alias) ════════
const FONT = {
  0: '0e11131519110e', 1: '040c040404040e', 2: '0e11010204081f', 3: '1f02040201110e', 4: '02060a121f0202',
  5: '1f101e0101110e', 6: '0608101e11110e', 7: '1f010204080808', 8: '0e11110e11110e', 9: '0e11110f01020c',
  A: '0e1111111f1111', B: '1e11111e11111e', C: '0e11101010110e', D: '1c12111111121c', E: '1f10101e10101f',
  F: '1f10101e101010', G: '0e11101711110f', H: '1111111f111111', I: '0e04040404040e', J: '0702020202120c',
  K: '11121418141211', L: '1010101010101f', M: '111b1515111111', N: '11111915131111', O: '0e11111111110e',
  P: '1e11111e101010', Q: '0e11111115120d', R: '1e11111e141211', S: '0f10100e01011e', T: '1f040404040404',
  U: '1111111111110e', V: '11111111110a04', W: '1111111515150a', X: '11110a040a1111', Y: '1111110a040404',
  Z: '1f01020408101f', '-': '0000001f000000', '.': '00000000000c0c', ':': '000c0c000c0c00',
  '!': '04040404040004', '/': '01010204081010', '+': '0004041f040400', '?': '0e110102040004',
};
const textW = (s, k = 1) => s.length * 6 * k - k;
function glyphs(c, s, x, y, col, k) {
  c.fillStyle = col;
  for (const ch of s) {
    const g = FONT[ch];
    if (g) for (let r = 0; r < 7; r++) {
      const bits = parseInt(g.substr(r * 2, 2), 16);
      for (let b = 0; b < 5; b++) if (bits >> (4 - b) & 1) c.fillRect(x + b * k, y + r * k, k, k);
    }
    x += 6 * k;
  }
}
function text(c, s, x, y, col, k = 1, edge = '#000') {    // outlined, with a drop shadow
  for (const [dx, dy] of [[k, 0], [-k, 0], [0, k], [0, -k], [k, k]]) glyphs(c, s, x + dx, y + dy, edge, k);
  glyphs(c, s, x, y, col, k);
}

// ════════ H2-X rig: white shell, black joints, face screen ════════
const D = Math.PI / 180;
const RIG = { thigh: 25, shin: 24, spine: 29, neck: 4, ua: 17, fa: 16, hip: 4.5, shN: [-11, 23.5], shF: [8.5, 24.5] };
const dir = a => [Math.sin(a), -Math.cos(a)];      // bone angle: 0 = down, +90° = forward, 180° = up

function solve(B, T, L1, L2, bend) {               // two-bone IK → absolute bone angles
  const dx = T[0] - B[0], dy = T[1] - B[1];
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + .01), L1 + L2 - .01);
  const A = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
  const a1 = Math.atan2(dx, -dy) + bend * A, [mx, my] = dir(a1);
  return [a1, Math.atan2(dx - mx * L1, -(dy - my * L1))];
}
// pose → joint positions. rot spins the whole body (+ = forward flip); IK targets are origin-relative
function skeleton(P) {
  const rot = (P.rot || 0) * D, t = P.t * D + rot, ht = t + (P.h ?? -P.t * .5) * D;   // head keeps eyes on target
  const up = [Math.sin(t), Math.cos(t)], fw = [Math.cos(t), -Math.sin(t)];
  const T = (lx, ly) => [P.x + fw[0] * lx + up[0] * ly, P.y + fw[1] * lx + up[1] * ly];
  const neck = T(0, RIG.spine), hu = [Math.sin(ht), Math.cos(ht)], hf = [Math.cos(ht), -Math.sin(ht)];
  const hb = [neck[0] + hu[0] * RIG.neck, neck[1] + hu[1] * RIG.neck];
  const H = (lx, ly) => [hb[0] + hf[0] * lx + hu[0] * ly, hb[1] + hf[1] * lx + hu[1] * ly];
  const limb = (base, sp, L1, L2, bend) => {

// 3/4 view facing right: right side is near the camera. Draw order far arm → far leg → torso → head → near leg → near arm
function bodyParts(S) {
  const out = [];
  const add = (shape, mat, R, layer, o) => out.push(Object.assign({ ...shape, mat, R, layer }, o));
  arm(S.fArm, 0, -.15); leg(S.fLeg, 1, -.15); torso(2); head(3); leg(S.nLeg, 4, 0); arm(S.nArm, 5, 0);
  return out;

  function arm(A, layer, dk) {
    add(circle(A.base, 5.8), MAT.white, 4.4, layer, { dk });                     // shoulder cap
    add(capsule(A.base, A.mid, 5, 4.2), MAT.white, 4.6, layer, { dk });
    add(circle(A.mid, 3.7), MAT.black, 3.2, layer, { dk });                      // elbow
    const fore = capsule(A.mid, A.end, 4.6, 3.7);
    add(fore, MAT.white, 4.2, layer, { dk });
    add(capsule(lerp(A.mid, A.end, .62), A.end, 5, 4.4), MAT.black, 4.2, layer, { dk, clip: fore.f, form: fore.f });
    const a = A.a2 + (A.sp.hr || 0) * D, ex = dir(a), ey = dir(a + Math.PI / 2);
    const W = (lx, ly) => [A.end[0] + ex[0] * lx + ey[0] * ly, A.end[1] + ex[1] * lx + ey[1] * ly];
    if (A.sp.hand === 'palm') {
      add(poly([W(-1, -2.8), W(8.6, -2.4), W(9.8, -.5), W(9, 2.6), W(-1, 3)], .9), MAT.black, 2.6, layer, { dk });
      add(capsule(W(1, -2), W(4.2, -5.2), 1.6, 1.3), MAT.black, 1.5, layer, { dk });
    } else {
      const fist = poly([W(-.5, -3.8), W(6.4, -4), W(8, -2), W(7.8, 3), W(6, 4), W(-.5, 3.6)], 1.2);
      add(fist, MAT.black, 3.6, layer, { dk });
      add(poly([W(1.5, 1.4), W(7.4, 1.2), W(7.6, 4.8), W(1.5, 4.8)]), MAT.white, 3.6, layer, { dk, clip: fist.f, form: fist.f });
    }
  }
  function leg(G, layer, dk) {
    add(capsule(G.base, G.mid, 7.6, 5.6), MAT.white, 6.6, layer, { dk });
    add(circle(G.mid, 4.8), MAT.black, 4, layer, { dk });                        // knee
    const shin = capsule(G.mid, G.end, 5.6, 3.6);
    add(shin, MAT.white, 5, layer, { dk });
    // calf: the back half of the shin is black (split along the bone axis)
    const [ax, ay] = bp(G.mid), [bx, by] = bp(G.end), L = Math.hypot(bx - ax, by - ay) || 1;
    const calf = { f: (x, y) => ((x - ax) * (by - ay) - (y - ay) * (bx - ax)) / L + .8, bb: shin.bb };   // <0 behind the bone
    add(calf, MAT.black, 5, layer, { dk, clip: (x, y) => Math.max(shin.f(x, y), -Math.hypot(x - ax, y - ay) + 6), form: shin.f, inset: .5 });
    add(circle(G.end, 3), MAT.black, 2.4, layer, { dk });                        // ankle
    const fo = (G.sp.fo || 0) * D + S.rot, ex = [Math.cos(fo), -Math.sin(fo)], ey = [Math.sin(fo), Math.cos(fo)];
    const F = (lx, ly) => [G.end[0] + ex[0] * lx + ey[0] * ly, G.end[1] + ex[1] * lx + ey[1] * ly];
    const shoe = poly([F(-3.8, 1.8), F(-4.8, -1.8), F(-4, -3.4), F(9.6, -3.4), F(11.2, -1.9), F(10.2, -.4), F(5.4, 1.2), F(1.6, 2.9), F(-2, 3.2)], .7);
    add(shoe, MAT.white, 2.6, layer, { dk });
    add(poly([F(-7, -2), F(13, -2), F(13, -6), F(-7, -6)]), MAT.black, 2.6, layer, { dk, clip: shoe.f, form: shoe.f, inset: 0 });
  }
  function torso(layer) {
    const T = S.T;
    add(capsule(T(.3, 26), S.hb, 3, 2.7), MAT.black, 2.6, layer);               // neck
    const pelvis = poly([T(-9.5, 6), T(7.5, 6), T(10, 0), T(7, -5.5), T(.5, -8.5), T(-7, -5.5), T(-10.5, 0)], 1.5);
    add(pelvis, MAT.white, 5, layer);
    add(poly([T(-3, -1.5), T(4, -1.5), T(2, -10), T(-1.5, -10)], 1), MAT.black, 5, layer, { clip: pelvis.f, form: pelvis.f });
    add(poly([T(-7, 13), T(7, 13), T(6, 4), T(-6.5, 4)], 1), MAT.metal, 4, layer);    // narrow waist
    const chest = poly([T(-12.5, 26), T(-4, 29.2), T(7, 28.6), T(12.5, 23), T(11.5, 15.5), T(6, 11), T(-6, 11), T(-11.5, 15), T(-13.5, 21)], 2);
    add(chest, MAT.white, 7, layer);
    add(poly([T(-18, 24), T(-7.5, 21), T(-5, 8), T(-18, 8)]), MAT.black, 7, layer, { clip: chest.f, form: chest.f });
    add(circle(T(6, 21), 1.2), MAT.glow, 1, layer, { clip: chest.f });           // status light
  }
  function head(layer) {
    const H = S.H, shell = ellipse(H(1.3, 9), 7.8, 9.4, -S.ht);
    add(shell, MAT.white, 7, layer);
    add(poly([H(.6, 15.6), H(11, 15.6), H(11, 2.2), H(4.4, 1.4), H(1.1, 3.6), H(-.7, 9)], 1.2), MAT.screen, 7, layer,

  }
}
function bakePose(pose) {
  useBuf(176, 176, 88, 156);

  s.eyes = S.eyes.map(bp).map(([x, y]) => [Math.floor(x), Math.floor(y)]);

}

// face-screen expressions, drawn over the visor at runtime: [near eye, far eye]
const EXPR = {
  open:  [['.b.', 'bab', 'bab', '.b.'], ['b.', 'ab', 'ab', 'b.']],
  blink: [['...', '...', 'bbb', '...'], ['..', '..', 'bb', '..']],
  glare: [['b..', '.bb', 'aab', '...'], ['..', 'bb', 'ab', '..']],
  happy: [['...', '.b.', 'b.b', '...'], ['..', 'b.', '.b', '..']],
  sad:   [['bbb', '.b.', '.a.', '.c.'], ['bb', 'b.', 'a.', 'c.']],
  wow:   [['bbb', 'b.b', 'b.b', 'bbb'], ['bb', 'b.', 'b.', 'bb']],
};
const EYEC = { a: PAL[12], b: PAL[13], c: PAL[14] };
function drawEyes(c, s, exp, ox, oy) {
  EXPR[exp].forEach((pat, k) => {
    const [ax, ay] = s.eyes[k], w = pat[0].length, h = pat.length;
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
      const ch = pat[r][q];
      if (ch === '.') continue;
      const bx = ax + q - (w >> 1), by = ay + r - (h >> 1), mx = bx - s.x0, my = by - s.y0;
      if (mx < 0 || my < 0 || mx >= s.w || my >= s.h || !s.mask[my * s.w + mx]) continue;
      c.fillStyle = EYEC[ch];
      c.fillRect(ox + bx - s.ox, oy + by - s.oy, 1, 1);
    }
  });
}

// ════════ hitting the car ════════
function resetCar() {

}
function hitCheck(f) {

  if (z !== 'cabin') car.hp.cabin = Math.min(ZHP.cabin, car.hp.cabin + dmg * .35);
  score += dmg * 50;

// ════════ round flow: title → ready → play → end → tally → done ════════
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

}
function endRound(win) {

}

// ════════ drawing ════════
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');

  ctx.drawImage(car.spr.cv, sx + car.spr.dx, GROUND + by + car.spr.dy);

}

    ctx.save(); ctx.translate(Math.round(d.x - camX), Math.round(GROUND - d.y)); ctx.rotate(-d.rot);

}

}
const center = (s, y, col, k) => text(ctx, s, (SW - textW(s, k)) >> 1, y, col, k);
const SHADE = layer(SW);                          // 50% checkerboard dim behind the results text
for (let y = 0; y < SH; y++) for (let x = y & 1; x < SW; x += 2) fill(SHADE, '#04050a', x, y, 1, 1);

// ════════ page wiring: buttons, touch pad, sizing ════════
const $ = id => document.getElementById(id);
function toggleSound() { muted = !muted; $('bSound').setAttribute('aria-pressed', !muted); if (!muted) audioOn(); }
$('bSound').onclick = toggleSound;
$('bBox').onclick = e => { showBox = !showBox; e.currentTarget.setAttribute('aria-pressed', showBox); };
$('bSheet').onclick = e => {
  const b = $('sheetBox'), on = b.hidden;
  b.hidden = !on; e.currentTarget.setAttribute('aria-pressed', on);

};
cv.addEventListener('pointerdown', () => { audioOn(); press('START'); });
const pad = $('pad'), stick = $('stick'), knob = $('knob');

addEventListener('touchstart', enableTouch, { passive: true });
let stickId = null;
function moveStick(e) {                           // 8-way stick with a dead zone

  const d = Math.hypot(dx, dy), k = Math.min(1, (r.width / 2 - 24) / (d || 1));

  moveStick(e);
});
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
for (const t of ['pointerup', 'pointercancel']) stick.addEventListener(t, e => {

});

for (const b of pad.querySelectorAll('button')) {

    e.preventDefault(); audioOn(); b.classList.add('on');
    const sp = SP[b.dataset.sp];

  });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(t, () => b.classList.remove('on'));
}

  if (touchMode && innerWidth > innerHeight && innerHeight < 520) w = Math.min(vh * SW / SH, innerWidth - 128 - 184 - 56);
  else if (touchMode) w = Math.min(vw, (vh - 190) * SW / SH);
  else { w = Math.min(vw, (vh - 150) * SW / SH); if (w >= SW) w = Math.floor(w / SW) * SW; }

addEventListener('resize', fit);
function buildSheet() {

  const Um = Math.max(...sp.map(s => -s.dy)), Dm = Math.max(...sp.map(s => s.dy + s.h));

function selfTest() {                              // open with #test to run
  const ok = (c, m) => { if (!c) throw new Error('selfTest: ' + m); };
  ok(motion([5, 2, 3, 6], [2, 3, 6]), 'qcf');
  ok(!motion([5, 2, 6], [2, 3, 6]), 'qcf needs the diagonal');
  ok(motion([6, 5, 2, 3], [6, 2, 3]), 'dp');
  ok(relDir(4, -1) === 6 && relDir(3, -1) === 1 && relDir(8, -1) === 8, 'mirror');
  ok(Math.sin(solve([0, 47], [10, 4], 25, 24, 1)[0]) > 0, 'knee bends forward');
  ok(atlas.naturalWidth === 594 && atlas.naturalHeight === 604 && CAR_FRAMES.length === 10, 'original atlas loaded');
  ok(carTop(0) === 102 && carTop(-115) === -1 && carTop(114) === 42, 'enlarged roof profile');
  for (const face of [1, -1]) {
    resetCar(); resetHero(); state = 'play';
    hero.face = face; hero.x = car.x - face * (CAR_HALF + HW + .5);
    for (const key of ['LP', 'MP', 'HP', 'LK', 'MK', 'HK', 'cP', 'cK', 'ELB', 'KNEE']) {
      play(hero, key); hero.fi = hero.mv.f.findIndex(f => f[2]?.hit); enter(hero);
      const before = score; hitCheck(hero);
      ok(score > before, key + ' connects at bumper facing ' + face);
      const after = score; hitCheck(hero); ok(score === after, 'one hit per active frame');
      resetCar();
    }
    hero.x = car.x - face * 100; hero.y = 0; pushOut(hero);
    ok(Math.abs(hero.x - car.x) > CAR_HALF + HW, 'body blocks both sides');
    play(hero, 'idle');
    for (let n = 0; n < 90 && !hero.onCar; n++) update(hero, { dir: n < 4 ? (face === 1 ? 9 : 7) : 5, btn: new Set() });
    ok(hero.onCar && !hero.air, 'jump reaches enlarged car from side ' + face);
  }
  resetCar(); resetHero(); state = 'play';
  hero.x = car.x; hero.y = 110; hero.air = true; hero.vy = -4;
  play(hero, 'jS'); hero.y = 100;
  collide(hero, 110);
  ok(hero.onCar && !hero.air && car.hp.cabin > 0, 'stomp hits before roof landing');
  for (const key of ['roofP', 'roofK']) {
    hero.y = topUnder(hero.x); play(hero, key); hero.fi = 1; enter(hero);
    const before = car.hp.cabin; hitCheck(hero); ok(car.hp.cabin > before, key + ' damages roof');
  }
  hero.x = car.x + CAR_HALF + HW + 1; collide(hero, hero.y);
  ok(hero.air && !hero.onCar, 'walk off roof');
  for (let rear = 0; rear < 4; rear++) for (let cabin = 0; cabin < 4; cabin++) for (let front = 0; front < 4; front++) {
    car.lv = { rear, cabin, front }; bakeCar();
    ok(car.spr.cv.width === 228 && car.spr.cv.height === 110, 'all 64 damage combinations keep dimensions');
    ok(Number.isFinite(carTop(0)), 'damaged roof stays finite');
  }
  resetCar(); state = 'play';
  for (const z in ZONES) hitCar(z, 0, 40, ZHP[z]);
  ok(perfect && state === 'end' && carShape().wreck, 'complete destruction wins');
  state = 'play'; timer = 1; freeze = 0; step();
  ok(state === 'end' && !perfect && timer === 0, 'timeout loses');
  freeze = 10; quake = 8; newRound();
  ok(timer === ROUND && freeze === 0 && quake === 0 && !perfect && state === 'ready', 'retry resets round');
  resetCar(); resetHero(); state = 'title'; st = score = bonus = bonusTotal = 0;
  fx.length = debris.length = 0; camera(true);
  console.log('selfTest OK');
}

atlas.onload = () => {
  prepareCarSprites();
  resetCar(); resetHero(); camera(true); fit();
  $('assetStatus').hidden = true;
  if (location.hash === '#test') selfTest();
  let last = performance.now(), acc = 0;
  requestAnimationFrame(function loop(now) {
    acc = Math.min(acc + (now - last) / 1000, .1); last = now;
    while (acc >= 1 / 60) { acc -= 1 / 60; step(); }
    render();
    requestAnimationFrame(loop);
  });
};
atlas.onerror = () => {
  $('assetStatus').textContent = '汽车素材加载失败，请刷新重试，并确认 assets/ssf2-car-stage.png 文件存在。';
};
atlas.src = 'assets/ssf2-car-stage.png';
fit();
</script>
